# Dependabot (GPU-493). One pull request per ecosystem a week, every update
# grouped into it: a pull request per dependency would bury the few that
# matter, and the repository's CI runs on each one in full.
#
# github-actions moves the actions the workflows pin by commit, comment and
# all, which is the half of pinning that otherwise never happens. The
# container images the workflows pin by digest are not in reach of any
# ecosystem here, and are moved by hand.
# Each update waits seven days after its release (GPU-493): a package
# taken over and republished is usually found out within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # Cargo.lock: what the crate and the wheels are built with (`--locked`).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ["*"]
  # pyproject.toml and requirements.txt: the build and test tools.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  # No docker entry: this repository has no Dockerfile, and Dependabot
  # reports an ecosystem with nothing to read as an error every week.
