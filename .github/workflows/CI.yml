name: CI

# Every check this repository runs, in one file (GPU-489): the quick clippy and
# unit-test gate, the full suite (the S3 backend, the PyTorch adapter, Python
# 3.11 through 3.14 and 3.14t) and the delta benchmark. CD.yml calls this same
# file on the commit it publishes, so what guards a branch and what guards a
# release cannot drift apart.
#
# Every branch runs the full suite, not only main. That is the opposite of the
# old split, where a branch got only the quick gate and the matrix waited for
# main, so a failure specific to one interpreter or to the S3 backend surfaced
# after the merge. It costs a container job per interpreter on each push; the
# quick `checks` job still runs beside them, so a broken build or a clippy
# finding is still reported first and with the shortest log.
on:
  push:
    # deploy runs this file itself, through CD.yml, before it tags (GPU-443):
    # triggering it here as well would run the whole suite twice on the same
    # commit. Naming only branches also keeps a pushed tag from starting it.
    branches-ignore: [deploy]
  # Replay it without inventing a commit — the same reason ravex has one, and
  # for the bench the more useful trigger: re-running it on an unchanged main
  # is how you find out how much of a delta is just the runner.
  workflow_dispatch:
  # CD.yml runs it on the commit it publishes, before the tag.
  workflow_call:

# The job token only reads: nothing here pushes, tags or comments, and releases
# go out from CD.yml with their own short-lived publish tokens.
permissions:
  contents: read

# Pinned, all of it (GPU-493). Each action by its commit, with the tag beside
# it: a tag can be moved by whoever controls the action, and CD.yml runs this
# file on the commit it is about to publish. Each container image by its
# digest: a tag like `rust:1.99.1-bookworm` is rebuilt upstream every few
# weeks, so the same commit could otherwise build on a different system from
# one day to the next. Dependabot moves the actions; the digests are moved by
# hand, with `docker buildx imagetools inspect <image:tag>`.
#
# And every job has a `timeout-minutes`: GitHub's default is six hours, so a
# test that hangs would hold the runner, and a release waiting on this file,
# that long. Each value is several times the slowest green run of the job in
# November 2026 (none took over three minutes), and never under fifteen,
# because every job here compiles the crate from cold and a slow crates.io
# mirror alone can triple that.
jobs:
  # The quick gate. It has to be quick enough that it is never the reason to
  # skip a push, and honest enough to be worth looking at.
  #
  # One job, one container, no S3 server and no interpreter matrix: `cargo
  # test` covers the library in seconds, and clippy covers the rest. The `rust`
  # job below runs a superset of these tests against a real S3 server, but
  # nothing else in this file runs clippy, so this job stays: it is the gate.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The same image as the `rust` and `bench` jobs below and CD.yml's
      # `crate` job. Bump them together, digest included.
      image: rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      # Not shallow, and the checkout is allowed to fail the job — the same
      # reasoning as the other jobs: `--depth 1` fetches only the default
      # branch's tip, so the pushed commit is not in the clone and the job
      # silently tests main instead. A green tick for code nobody built is
      # worse than no tick.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Clippy
        run: |
          set -eu
          rustup component add clippy
          # `-D warnings` so a new lint fails the branch rather than scrolling
          # past. One allowance remains:
          #
          #   too_many_arguments  MoonclipManager::new takes 24 — it is the
          #                       Python constructor, and every argument is a
          #                       documented keyword.
          #
          # Anything not on this list is a real finding and stops the push.
          #
          # `type_complexity`, `unnecessary_sort_by` and `manual_checked_ops`
          # used to be here as well. The last two only exist from clippy 1.97,
          # which this container did not have, so they were listed against a
          # toolchain that could not raise them; all three findings are fixed
          # and the lines are gone with them.
          #
          # `-A unknown-lints` stays, and is now the only thing keeping this
          # readable across a toolchain change: naming a lint an older clippy
          # does not know is `error[E0602]`, which `-D warnings` turns into a
          # hard failure. This job had never passed for exactly that reason.
          # What it costs is that a misspelled lint name above is ignored
          # rather than reported.
          cargo clippy --all-targets --features python -- \
            -D warnings \
            -A unknown-lints \
            -A clippy::too_many_arguments

      # Last, because a compile error should be reported by clippy above with a
      # better message than a bare test failure — and split in two so that when
      # something does go red, the step name already says whether it was the
      # build or the tests. Compiling first also keeps the test step's log to
      # test output instead of a wall of rustc.
      - name: Build the test binaries
        run: |
          set -eu
          cargo test --no-run --lib --tests

      - name: Rust tests
        run: |
          set -eu
          cargo test --lib --tests

      # No bench target here, deliberately. This used to be `--all-targets`,
      # which does not just build `delta_bench` — it runs it: `harness = false`
      # means cargo executes the binary's `main` rather than probing it for test
      # cases, and that main walks three 256 MB buffers five times. The branch
      # guard was spending most of its budget measuring memory bandwidth, in a
      # debug build, and reporting the result as a test pass. The timings now
      # live in the `bench` job below, on main.
      #
      # Nothing is lost by not building it here: the clippy step above passes
      # `--all-targets`, so a change to `delta` that leaves the bench
      # uncompilable still fails this job — with a better message, and without
      # codegen.

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The S3 server runs as a plain background process rather than a
      # `services:` container: a service block cannot pass the arguments the
      # server needs, and working around that means depending on how a
      # particular runner implements services. The binary is self-contained.
      #
      # **versitygw, not MinIO, since 2026-09-15.** MinIO's open-source server
      # is archived and dl.min.io answers `410 Gone` for every binary, archived
      # releases included. This step used to save that notice as
      # /usr/local/bin/minio and try to execute it. versitygw is maintained,
      # ships a static binary, and every test in tests/s3_minio.rs passed
      # against it in this same image: 19 passed, 1 ignored, as with MinIO.
      # Pinned, and fetched with `curl -f`, so the next download that turns
      # into a web page stops here instead of being run.
      #
      # The bucket is made by creating the directory before startup: the posix
      # backend serves each top-level directory under its root as a bucket, the
      # same trick MinIO allowed. The credentials keep MinIO's names because the
      # tests read them from the environment and nothing else cares.
      - name: Start the S3 server
        run: |
          set -eu
          VGW=1.8.0
          # The sha256 versity publishes for this asset in the release's
          # checksums.txt (GPU-493). A release asset can be replaced after the
          # fact, and this binary runs with the job's network and files: a
          # different one stops here instead of being run. Moving VGW means
          # taking the new checksum from the new release.
          VGW_SHA256=2ba2c734d10d2c4e651d03182cb4b246656bc735a2f282db7b0b73fba6073467
          curl -sSfL -o /tmp/vgw.tgz \
            "https://github.com/versity/versitygw/releases/download/v${VGW}/versitygw_v${VGW}_Linux_x86_64.tar.gz"
          echo "${VGW_SHA256}  /tmp/vgw.tgz" | sha256sum -c -
          tar -xzf /tmp/vgw.tgz -C /tmp
          install -m 0755 "/tmp/versitygw_v${VGW}_Linux_x86_64/versitygw" /usr/local/bin/versitygw
          mkdir -p /tmp/s3-data/moonclip-test
          versitygw --access minioadmin --secret minioadmin --port :9000 \
            posix /tmp/s3-data >/tmp/s3.log 2>&1 &
          for _ in $(seq 1 30); do
            # Unauthenticated, the root answers 403: any status at all means
            # the server is listening.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then
              echo "versitygw is up (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "versitygw did not come up:" >&2
          cat /tmp/s3.log >&2
          exit 1

      # Without these variables tests/s3_minio.rs skips itself, so a failure
      # here means the S3 backend broke — not that the environment is missing.
      # That distinction is the point of running it in CI at all: whether a
      # server accepts what rusty-s3 signs is only known by sending it.
      - name: Rust tests
        env:
          MOONCLIP_S3_ENDPOINT: http://127.0.0.1:9000
          MOONCLIP_S3_BUCKET: moonclip-test
          MOONCLIP_S3_ACCESS_KEY: minioadmin
          MOONCLIP_S3_SECRET_KEY: minioadmin
        run: cargo test

  # The matrix job below installs no torch, so everything behind
  # `importorskip("torch")` is skipped there: the engine is covered on six
  # interpreters, the PyTorch adapter on none. That adapter is what downstream
  # users actually call, and it is where the multi-rank save flow lives, so it
  # gets one job of its own with a real torch in it.
  torch-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.99.1 --profile minimal --component clippy

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Build and test with PyTorch
        run: |
          . "$HOME/.cargo/env"
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          # CPU wheels: these tests are about correctness, not throughput, and
          # the CUDA build is gigabytes of download for nothing.
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          maturin develop
          # test_multirank spawns one process per rank and talks over gloo on
          # loopback, so the runner needs no GPU and no special networking.
          pytest tests/ -v

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version CD.yml ships a wheel for: a version we publish is a
        # version we test. Keep this list, the classifiers in pyproject.toml,
        # and the build lists of the wheel jobs in CD.yml in step with each
        # other.
        python: ["3.11", "3.12", "3.13", "3.14"]
        # The image of each interpreter, by digest (see the top of the file).
        # A new interpreter goes in both lists.
        include:
          - python: "3.11"
            image: python:3.11-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6
          - python: "3.12"
            image: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
          - python: "3.13"
            image: python:3.13-bookworm@sha256:cc55e4ded9c95f6ce2133b3d096db43f214d280c2a8af65d83e246c8fa7d168c
          - python: "3.14"
            image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    timeout-minutes: 15
    container:
      # One official image per version. Each ships that interpreter with pip
      # already in it, so the job needs no Python version manager and no venv:
      # the container *is* the environment. Bookworm's own python3 is 3.11
      # only, which is why the image varies instead of the packages.
      image: ${{ matrix.image }}
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Debian bookworm packages rustc 1.63; this crate needs 1.85 (see
          # rust-version in Cargo.toml), so the toolchain comes from rustup.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.99.1 --profile minimal --component clippy

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Build and test on Python ${{ matrix.python }}
        run: |
          . "$HOME/.cargo/env"
          python --version
          # maturin develop refuses to install into a bare interpreter — it
          # needs VIRTUAL_ENV or CONDA_PREFIX even inside a container. The
          # stdlib venv module seeds pip on its own, so this stays pip-only.
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          maturin develop
          pytest tests/ -v

  # The free-threaded build of 3.14, which CD.yml ships a cp314t wheel for
  # (GPU-189). Its own job rather than a fifth matrix entry: the official
  # `python:3.14` image has the GIL, and no official image has 3.14t, so uv
  # fetches the interpreter instead of the image providing it.
  python-free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal --component clippy

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Test on Python 3.14t
        run: |
          set -eu
          . "$HOME/.cargo/env"
          pip install --quiet uv
          uv venv --python 3.14t /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          python -VV
          uv pip install --quiet -e . pytest
          # The point of the job, checked on its own. A module that does not
          # declare itself safe without the GIL makes 3.14t turn the GIL back
          # on at import, with a warning and nothing else: every test below
          # would pass, on what is then an ordinary interpreter.
          python -c "import sys, moonclip; assert not sys._is_gil_enabled(), 'importing moonclip re-enabled the GIL'"
          pytest tests -v

  # Split out of the quick gate, where it never belonged. The Rust step there
  # was `cargo test --all-targets`, and that does not merely build
  # `delta_bench` — it runs it. `harness = false` means cargo executes the
  # binary's `main` instead of probing it for test cases, so every branch push
  # was walking three 256 MB buffers five times, in a debug build, on the small
  # runner whose entire job is to answer quickly. It measured nothing usable
  # and spent the guard's budget doing it.
  #
  # Nothing here guards compilation. The `checks` job type-checks the bench on
  # every push already, because its clippy invocation passes `--all-targets` —
  # which is why dropping the bench from that job cost nothing.
  bench:
    # Main only, and never on a branch or in a release run from CD.yml. What
    # comes out of a shared runner is a tripwire, not a measurement: useful for
    # noticing that `delta` got an order of magnitude slower, useless for
    # anything finer, so it is worth its slow LTO build only where the numbers
    # can be compared run after run. A number worth quoting needs a machine
    # whose neighbours are known.
    if: ${{ github.ref == 'refs/heads/main' }}
    # The bench holds base, target and a distinct copy of base at 256 MB each,
    # plus a transient output buffer per call, so it peaks near 1.1 GB. That
    # ruled out Codeberg's small runners, whose quota also counted the
    # release `target/`; `ubuntu-latest` has 16 GB and does not count disk.
    runs-on: ubuntu-latest
    # The LTO build is the slow half, and the one most likely to grow.
    timeout-minutes: 20
    container:
      # The same image as the `checks` and `rust` jobs above. Bump them
      # together.
      image: rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      # Not shallow, same reasoning as the other jobs: `--depth 1` fetches only
      # the default branch's tip, and a job that benchmarks a commit it did not
      # check out is worse than no job.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # `--locked` because the whole value of a number here is comparing it with
      # the previous one, and a dependency that updated underneath makes that
      # comparison a lie without saying so.
      #
      # `cargo bench` rather than building and invoking the binary by hand: the
      # bench profile inherits `[profile.release]`, so this is the `lto = true`,
      # `codegen-units = 1` build. That is the only build worth timing — and
      # also the slow half of this job. If it ever runs past the runner's clock,
      # suspect the link-time optimisation, not the benchmark.
      - name: Run the delta benchmark
        run: |
          set -eu
          cargo bench --bench delta_bench --locked
